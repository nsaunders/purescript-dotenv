name: CI

on:
  push:
    branches: [master]
    paths:
      - 'examples/**/*.purs'
      - 'examples/**/*.js'
      - 'src/**/*.purs'
      - 'src/**/*.js'
      - 'test/**/*.purs'
      - 'test/**/*.js'
      - '*.json'
      - 'spago.yaml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'examples/**/*.purs'
      - 'examples/**/*.js'
      - 'src/**/*.purs'
      - 'src/**/*.js'
      - 'test/**/*.purs'
      - 'test/**/*.js'
      - '*.json'
      - 'spago.yaml'
      - '.github/workflows/ci.yml'

jobs:
  build:
    name: Build
    
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Set up a PureScript toolchain
        uses: purescript-contrib/setup-purescript@main
        with:
          purescript: "unstable"
          spago: "1.0.5"
          purs-tidy: "latest"

      - name: Cache PureScript dependencies
        uses: actions/cache@v2
        with:
          key: ${{ runner.os }}-spago-${{ hashFiles('spago.yaml') }}
          path: |
            .spago
            output

      - name: Check formatting
        run: purs-tidy check examples src test

      - name: Install PureScript dependencies
        run: spago fetch

      - name: Build source
        run: spago build --strict

      - name: Run tests
        run: spago test

      - name: Build examples
        run: spago build --purs-args 'examples/**/*.purs'
